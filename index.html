<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>15 Anos da Alice 🎀</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --azul:       #5aafd6;
            --azul-cl:    #a8d8ea;
            --azul-bg:    #e3f4fb;
            --azul-dk:    #2e7ea8;
            --marsala:    #9b3a4a;
            --marsala-cl: #c97080;
            --marsala-bg: #f8eaec;
            --ouro:       #c9a84c;
            --branco:     #ffffff;
            --texto:      #2c3e50;
        }

        /* ── fundo SVG gerado inline ── */
        body {
            font-family: 'Quicksand', sans-serif;
            min-height: 100vh;
            color: var(--texto);
            text-align: center;
            position: relative;
            overflow-x: hidden;
            background: url('fundo.jpg') center top / cover fixed;
        }

        /* Hero banner ilustrado */
        .hero {
            width: 100%;
            min-height: 500px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 32px;
            overflow: hidden;
            background: transparent;
        }

        .hero-svg {
            display: none;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            margin-top: auto;
        }

        .hero-titulo {
            display: none;
        }

        .hero-sub {
            display: none;
        }

        .timer-box {
            background: rgba(255,255,255,.85);
            border: 2px solid var(--azul-cl);
            border-radius: 50px;
            padding: 10px 26px;
            font-size: 1rem;
            font-weight: 700;
            color: var(--azul-dk);
            box-shadow: 0 4px 20px rgba(90,175,214,.18);
            backdrop-filter: blur(6px);
        }
        .timer-box span { color: var(--marsala); }

        /* ── seção de cards ── */
        .secao {
            padding: 36px 16px 60px;
            max-width: 1140px;
            margin: 0 auto;
        }

        .secao-titulo {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 1.1rem;
            color: var(--marsala);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .secao-titulo::before,
        .secao-titulo::after {
            content: '';
            flex: 1;
            max-width: 120px;
            height: 1.5px;
            background: linear-gradient(90deg, transparent, var(--marsala-cl));
        }
        .secao-titulo::after { background: linear-gradient(90deg, var(--marsala-cl), transparent); }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 18px;
            align-items: start;
        }

        /* ── card ── */
        .card {
            background: var(--branco);
            border-radius: 22px;
            border: 2px solid var(--azul-cl);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(90,175,214,.12);
            transition: transform .22s, box-shadow .22s;
            align-self: start;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 32px rgba(90,175,214,.22); }

        .card-stripe {
            height: 5px;
            background: repeating-linear-gradient(
                90deg,
                var(--marsala) 0px, var(--marsala) 10px,
                var(--azul) 10px, var(--azul) 20px
            );
        }

        .card-body {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 16px 14px 10px;
            flex: 1;
        }

        .card-body img {
            width: 120px; height: 120px;
            object-fit: contain;
            border-radius: 12px;
        }

        .card-body h3 {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--azul-dk);
            line-height: 1.3;
        }

        /* botão ver produto */
        .btn-ver-produto {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            padding: 8px 12px; border-radius: 10px;
            font-size: 0.82rem; font-weight: 700;
            font-family: 'Quicksand', sans-serif; text-decoration: none;
            color: white; border: none; cursor: pointer;
            background: linear-gradient(135deg, var(--azul), var(--azul-dk));
            box-shadow: 0 3px 10px rgba(90,175,214,.25);
            transition: opacity .18s, transform .15s;
            margin: 0 12px 8px;
        }
        .btn-ver-produto:hover { opacity: .88; transform: translateY(-1px); }

        /* ── botões de ação ── */
        .card-footer { padding: 0 12px 14px; display: flex; flex-direction: column; gap: 6px; }

        .btn-reservar {
            width: 100%; padding: 10px;
            border: none; border-radius: 50px;
            background: linear-gradient(135deg, var(--marsala), var(--marsala-cl));
            color: white; font-family: 'Quicksand', sans-serif;
            font-size: 0.85rem; font-weight: 700; cursor: pointer;
            box-shadow: 0 3px 12px rgba(155,58,74,.25);
            transition: opacity .18s, transform .15s;
        }
        .btn-reservar:hover { opacity: .9; transform: translateY(-1px); }

        .btn-cancelar {
            width: 100%; padding: 8px; border: 2px solid var(--azul-cl);
            border-radius: 50px; background: transparent;
            color: var(--azul-dk); font-family: 'Quicksand', sans-serif;
            font-size: 0.82rem; font-weight: 700; cursor: pointer;
            transition: background .15s;
        }
        .btn-cancelar:hover { background: var(--azul-bg); }

        .form-area { display: flex; flex-direction: column; gap: 6px; }

        .form-area input {
            width: 100%; padding: 9px 12px;
            border: 2px solid var(--azul-cl); border-radius: 10px;
            font-family: 'Quicksand', sans-serif; font-size: 0.85rem; font-weight: 600;
            color: var(--texto); background: var(--azul-bg); outline: none;
            transition: border-color .2s;
        }
        .form-area input:focus { border-color: var(--azul); background: white; box-shadow: 0 0 0 3px rgba(90,175,214,.15); }
        .form-area input::placeholder { color: #a8cfe0; }
        .form-area input.erro { border-color: var(--marsala); }

        .tag-reservado {
            display: inline-block;
            background: var(--marsala-bg); color: var(--marsala);
            border: 1.5px solid var(--marsala-cl); border-radius: 20px;
            padding: 8px 16px; font-size: 0.82rem; font-weight: 700;
        }

        /* ── rodapé ── */
        footer {
            padding: 20px;
            font-size: 0.8rem;
            color: var(--azul-dk);
            font-weight: 600;
            opacity: .7;
        }

        /* ── mobile ── */
        @media (max-width: 520px) {
            .hero { min-height: 420px; }
            .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .card-body img { width: 90px; height: 90px; }
            .card-body h3 { font-size: 0.78rem; }
            .btn-loja { font-size: 0.64rem; padding: 5px 3px; }
            .lojas-grid { gap: 4px; }
        }
        @media (max-width: 340px) {
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<!-- ── LISTA DE PRESENTES ── -->
<div class="secao">
    <h2 class="secao-titulo">🎁 Lista de Presentes</h2>
    <div id="root" class="grid">
        <p style="grid-column:1/-1;color:#aaa;padding:40px;">Carregando lista…</p>
    </div>
</div>

<footer>Feito com 💙 e ♥️ para os 15 anos da Alice · 2026</footer>

<script>
    // ── timer ──
    const alvo = new Date("Aug 1, 2026 21:00:00").getTime();
    function tick() {
        const d = alvo - Date.now();
        if (d <= 0) { document.getElementById('timer').textContent = '🎉 Chegou!'; return; }
        const dd = Math.floor(d/86400000);
        const hh = Math.floor((d%86400000)/3600000);
        const mm = Math.floor((d%3600000)/60000);
        const ss = Math.floor((d%60000)/1000);
        document.getElementById('timer').textContent = `${dd}d ${hh}h ${mm}m ${ss}s`;
    }
    tick(); setInterval(tick, 1000);

    // ── supabase ──
    const sb = window.supabase.createClient(
        'https://abojdhxobsyrzyiacaqf.supabase.co',
        'sb_publishable_RUJYFhofTbBt1CtW1ZtbtA_b_s83A4t'
    );

    function btnVerProduto(link) {
        if (!link) return '';
        return `<a class="btn-ver-produto" href="${link}" target="_blank" rel="noopener">🛒 Ver Produto</a>`;
    }

    async function carregar() {
        const { data, error } = await sb.from('presentes').select('*').order('id', { ascending: true });
        if (error || !data) {
            document.getElementById('root').innerHTML = '<p style="grid-column:1/-1;color:#c97080;padding:40px;">Erro ao carregar. Tente novamente.</p>';
            return;
        }
        document.getElementById('root').innerHTML = data.map(g => {
            const meu = sessionStorage.getItem(`res_${g.id}`);
            if (g.reservado) return `
                <div class="card">
                    <div class="card-stripe"></div>
                    <div class="card-body">
                        ${g.imagem_url ? `<img src="${g.imagem_url}" alt="${g.titulo}" loading="lazy">` : ''}
                        <h3>${g.titulo}</h3>
                    </div>
                    <div class="card-footer">
                        <span class="tag-reservado">${meu ? '✅ Obrigada! ❤️' : '🎀 Já reservado'}</span>
                    </div>
                </div>`;
            return `
                <div class="card" id="card-${g.id}">
                    <div class="card-stripe"></div>
                    <div class="card-body">
                        ${g.imagem_url ? `<img src="${g.imagem_url}" alt="${g.titulo}" loading="lazy">` : ''}
                        <h3>${g.titulo}</h3>
                    </div>
                    ${btnVerProduto(g.link_compra)}
                    <div class="card-footer">
                        <button class="btn-reservar" id="btn-${g.id}" onclick="abrirForm(${g.id})">🎁 Reservar este presente</button>
                        <div class="form-area" id="form-${g.id}" style="display:none;">
                            <input type="text" id="nome-${g.id}" placeholder="Seu nome" maxlength="60">
                            <input type="text" id="msg-${g.id}"  placeholder="Mensagem para a Alice (opcional)" maxlength="120">
                            <button class="btn-reservar" onclick="reservar(${g.id})">✔️ Confirmar</button>
                            <button class="btn-cancelar" onclick="fecharForm(${g.id})">Cancelar</button>
                        </div>
                    </div>
                </div>`;
        }).join('');
    }

    function abrirForm(id) {
        document.getElementById(`form-${id}`).style.display = 'flex';
        document.getElementById(`btn-${id}`).style.display  = 'none';
        document.getElementById(`nome-${id}`).focus();
    }
    function fecharForm(id) {
        document.getElementById(`form-${id}`).style.display = 'none';
        document.getElementById(`btn-${id}`).style.display  = 'block';
    }
    async function reservar(id) {
        const nomeEl = document.getElementById(`nome-${id}`);
        const nome   = nomeEl.value.trim();
        if (!nome) { nomeEl.classList.add('erro'); nomeEl.focus(); return; }
        nomeEl.classList.remove('erro');
        const msg = document.getElementById(`msg-${id}`).value.trim();
        sessionStorage.setItem(`res_${id}`, '1');
        const { error } = await sb.from('presentes')
            .update({ reservado: true, nome_reservante: nome, mensagem: msg })
            .eq('id', id);
        if (!error) carregar();
    }

    carregar();
</script>
</body>
</html>

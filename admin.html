
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Acesso Admin · 15 Anos da Alice</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400;1,700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

    :root {
      --marsala:    #7a2535;
      --marsala-md: #9b3a4a;
      --creme:      #faf3e8;
      --creme-dk:   #e8d8c0;
      --texto:      #3a1a20;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      min-height: 100vh;
      background: url('fundo.jpg') center top / cover no-repeat fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      position: relative;
    }

    /* espaço para mostrar o topo da imagem */
    .espacador { height: 360px; width: 100%; flex-shrink: 0; }

    .card {
      position: relative;
      width: 100%;
      max-width: 370px;
      background: linear-gradient(160deg, #fdf8f0 0%, #f5e8d0 100%);
      border-radius: 6px;
      padding: 36px 34px 30px;
      box-shadow:
        0 0 0 2px var(--marsala),
        0 0 0 7px #f5e8d0,
        0 0 0 9px var(--marsala),
        0 12px 50px rgba(0,0,0,.38);
      margin-bottom: 40px;
    }

    /* cantos decorativos */
    .card::before { content:'✦'; position:absolute; top:12px; left:16px; font-size:.9rem; color:var(--marsala); opacity:.4; }
    .card::after  { content:'✦'; position:absolute; bottom:12px; right:16px; font-size:.9rem; color:var(--marsala); opacity:.4; }

    .logo-wrap { text-align:center; margin-bottom:4px; }
    .logo-moldura {
      display:inline-block; border:2px solid var(--marsala);
      border-radius:50%; padding:6px 12px;
      font-size:1.3rem; color:var(--marsala); opacity:.8;
    }

    .titulo {
      font-family:'Playfair Display',serif; font-style:italic;
      font-size:1.5rem; color:var(--marsala);
      text-align:center; margin:10px 0 4px; line-height:1.2;
    }

    .divisor {
      display:flex; align-items:center; gap:8px;
      margin:8px 0 16px; color:var(--marsala); opacity:.4; font-size:.78rem;
    }
    .divisor::before,.divisor::after { content:''; flex:1; height:1px; background:var(--marsala); }

    .subtitulo { font-size:.78rem; color:#8a6a50; text-align:center; margin-bottom:22px; line-height:1.5; }

    .campo { position:relative; margin-bottom:10px; }
    .icone-campo {
      position:absolute; left:12px; top:50%;
      transform:translateY(-50%); font-size:.82rem; opacity:.45; pointer-events:none;
    }
    .campo input {
      width:100%; padding:11px 38px;
      border:1.5px solid var(--creme-dk); border-radius:8px;
      background:rgba(255,255,255,.75);
      font-family:'Quicksand',sans-serif; font-size:.88rem; font-weight:600;
      color:var(--texto); outline:none;
      transition:border-color .2s, box-shadow .2s, background .2s;
    }
    .campo input:focus {
      border-color:var(--marsala); background:rgba(255,255,255,.95);
      box-shadow:0 0 0 3px rgba(122,37,53,.10);
    }
    .campo input::placeholder { color:#b09878; font-weight:500; }

    .olho {
      position:absolute; right:11px; top:50%;
      transform:translateY(-50%);
      background:none; border:none; cursor:pointer;
      font-size:.88rem; opacity:.4; transition:opacity .2s;
    }
    .olho:hover { opacity:.7; }

    .btn-entrar {
      width:100%; padding:12px; margin-top:10px;
      border:none; border-radius:8px;
      background:linear-gradient(135deg, var(--marsala-md), var(--marsala));
      color:white; font-family:'Playfair Display',serif;
      font-style:italic; font-size:1rem; letter-spacing:.05em;
      cursor:pointer; box-shadow:0 4px 16px rgba(122,37,53,.28);
      transition:opacity .2s, transform .15s;
    }
    .btn-entrar:hover:not(:disabled) { opacity:.9; transform:translateY(-1px); }
    .btn-entrar:disabled { opacity:.6; cursor:not-allowed; }

    .spin {
      display:inline-block; width:13px; height:13px;
      border:2px solid rgba(255,255,255,.35);
      border-top-color:white; border-radius:50%;
      animation:girar .7s linear infinite;
      vertical-align:middle; margin-right:5px;
    }
    @keyframes girar { to { transform:rotate(360deg); } }

    /* esqueci senha — agora é clicável */
    .esqueci {
      display:block; text-align:center; margin-top:12px;
      font-size:.76rem; color:var(--marsala);
      cursor:pointer; opacity:.65;
      text-decoration:underline; background:none; border:none;
      font-family:'Quicksand',sans-serif; font-weight:600;
      width:100%;
      transition:opacity .2s;
    }
    .esqueci:hover { opacity:1; }

    .msg {
      margin-top:10px; padding:9px 12px; border-radius:7px;
      font-size:.8rem; font-weight:600; text-align:center; display:none;
      background:rgba(122,37,53,.07); color:var(--marsala);
      border:1px solid rgba(122,37,53,.18);
    }
    .msg.ativo { display:block; }
    .msg.ok { background:rgba(46,126,168,.07); color:#2e7ea8; border-color:rgba(46,126,168,.2); }

    /* tela de recuperação */
    #tela-recuperar { display:none; }

    #overlay {
      display:none; position:fixed; inset:0;
      background:rgba(250,243,232,.88); backdrop-filter:blur(4px);
      z-index:999; align-items:center; justify-content:center;
      flex-direction:column; gap:14px;
    }
    #overlay.ativo { display:flex; }
    #overlay .grande {
      width:44px; height:44px; border:4px solid var(--creme-dk);
      border-top-color:var(--marsala); border-radius:50%;
      animation:girar .8s linear infinite;
    }
    #overlay p { font-family:'Playfair Display',serif; font-style:italic; font-size:.95rem; color:var(--marsala); }

    @media (max-width:440px) {
      .espacador { height:160px; }
      .card { padding:28px 18px 24px; }
      .titulo { font-size:1.25rem; }
    }
  </style>
</head>
<body>

<div id="overlay">
  <div class="grande"></div>
  <p>Entrando no País das Maravilhas…</p>
</div>

<!-- espaço para mostrar o topo da imagem -->
<div class="espacador"></div>

<div class="card">
  <div class="logo-wrap"><span class="logo-moldura">🎀</span></div>
  <h1 class="titulo">Bem-vinda de volta!</h1>
  <div class="divisor">❧ ♥ ❧</div>
  <p class="subtitulo">Faça login para acessar o painel da Alice.</p>

  <!-- tela de login -->
  <div id="tela-login">
    <div class="campo">
      <span class="icone-campo">👤</span>
      <input type="email" id="email" placeholder="E-mail" autocomplete="username"/>
    </div>
    <div class="campo">
      <span class="icone-campo">🔒</span>
      <input type="password" id="senha" placeholder="Senha" autocomplete="current-password"/>
      <button class="olho" id="olho" type="button">👁</button>
    </div>
    <button class="btn-entrar" id="btn-login" onclick="entrar()">Entrar</button>
    <button class="esqueci" onclick="mostrarRecuperar()">Esqueci minha senha</button>
  </div>

  <!-- tela de recuperação de senha -->
  <div id="tela-recuperar">
    <p class="subtitulo" style="margin-bottom:14px;">Digite seu e-mail e enviaremos um link para redefinir sua senha.</p>
    <div class="campo">
      <span class="icone-campo">👤</span>
      <input type="email" id="email-recuperar" placeholder="Seu e-mail"/>
    </div>
    <button class="btn-entrar" id="btn-recuperar" onclick="enviarRecuperacao()">Enviar link de recuperação</button>
    <button class="esqueci" onclick="mostrarLogin()">← Voltar para o login</button>
  </div>

  <div class="msg" id="msg"></div>
</div>

<script>
  const sb = window.supabase.createClient(
    'https://abojdhxobsyrzyiacaqf.supabase.co',
    'sb_publishable_RUJYFhofTbBt1CtW1ZtbtA_b_s83A4t'
  );

  (async () => {
    sessionStorage.removeItem('admin_autorizado');
    await sb.auth.signOut();
  })();

  const emailEl  = document.getElementById('email');
  const senhaEl  = document.getElementById('senha');
  const btnEl    = document.getElementById('btn-login');
  const msgEl    = document.getElementById('msg');
  const olhoEl   = document.getElementById('olho');

  olhoEl.addEventListener('click', () => {
    const v = senhaEl.type === 'text';
    senhaEl.type = v ? 'password' : 'text';
    olhoEl.textContent = v ? '👁' : '🙈';
  });

  [emailEl, senhaEl].forEach(el =>
    el.addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); })
  );

  function mostrarMsg(txt, tipo='erro') {
    msgEl.textContent = txt;
    msgEl.className = 'msg ativo' + (tipo === 'ok' ? ' ok' : '');
  }

  function mostrarRecuperar() {
    document.getElementById('tela-login').style.display = 'none';
    document.getElementById('tela-recuperar').style.display = 'block';
    msgEl.className = 'msg';
  }

  function mostrarLogin() {
    document.getElementById('tela-recuperar').style.display = 'none';
    document.getElementById('tela-login').style.display = 'block';
    msgEl.className = 'msg';
  }

  function ir() {
    sessionStorage.setItem('admin_autorizado', '1');
    document.getElementById('overlay').classList.add('ativo');
    setTimeout(() => { window.location.href = 'admin.html'; }, 900);
  }

  async function entrar() {
    msgEl.className = 'msg';
    const email = emailEl.value.trim();
    const senha = senhaEl.value;
    if (!email) { mostrarMsg('Informe seu e-mail.'); emailEl.focus(); return; }
    if (!senha)  { mostrarMsg('Informe sua senha.');  senhaEl.focus(); return; }

    btnEl.disabled = true;
    btnEl.innerHTML = '<span class="spin"></span> Verificando…';

    const { error } = await sb.auth.signInWithPassword({ email, password: senha });

    btnEl.disabled = false;
    btnEl.innerHTML = 'Entrar';

    if (error) {
      const erros = {
        'Invalid login credentials': 'E-mail ou senha incorretos.',
        'Email not confirmed':        'Confirme seu e-mail antes de entrar.',
        'Too many requests':          'Muitas tentativas. Aguarde um momento.',
      };
      mostrarMsg(erros[error.message] ?? 'Algo deu errado. Tente novamente.');
      senhaEl.value = ''; senhaEl.focus();
      return;
    }
    ir();
  }

  async function enviarRecuperacao() {
    const email = document.getElementById('email-recuperar').value.trim();
    if (!email) { mostrarMsg('Informe seu e-mail.'); return; }

    const btn = document.getElementById('btn-recuperar');
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span> Enviando…';

    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/login.html'
    });

    btn.disabled = false;
    btn.innerHTML = 'Enviar link de recuperação';

    if (error) {
      mostrarMsg('Erro ao enviar. Verifique o e-mail informado.');
    } else {
      mostrarMsg('✅ Link enviado! Verifique sua caixa de entrada.', 'ok');
    }
  }
</script>
</body>
</html>

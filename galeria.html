<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Galeria ao Vivo · Alice 15 Anos</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400;1,700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Quicksand',sans-serif; background:#000; color:white; overflow:hidden; width:100vw; height:100vh; }

    /* Fundo desfocado com Ken Burns */
    #bg {
      position:fixed; inset:0; z-index:0;
      background-size:cover; background-position:center;
      filter:blur(24px) brightness(.35) saturate(1.2);
      transform:scale(1.15);
      transition:background-image 1s ease;
      animation:kenburns-bg 20s ease-in-out infinite alternate;
    }
    @keyframes kenburns-bg {
      from { transform: scale(1.15) translate(0,0); }
      to   { transform: scale(1.25) translate(-2%,-1%); }
    }

    /* Header */
    .header {
      position:fixed; top:0; left:0; right:0; z-index:10;
      display:flex; align-items:center; justify-content:space-between;
      padding:18px 32px;
      background:linear-gradient(180deg,rgba(0,0,0,.75),transparent);
    }
    .header-left { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .logo { font-size:1.5rem; }
    .titulo { font-family:'Playfair Display',serif; font-style:italic; font-size:1.3rem; color:#f0dda0; letter-spacing:.03em; }
    .badge-live { display:flex; align-items:center; gap:6px; background:rgba(155,58,74,.85); border-radius:50px; padding:5px 14px; font-size:.75rem; font-weight:700; border:1px solid rgba(201,168,108,.3); }
    .dot { width:8px; height:8px; border-radius:50%; background:#ff6b6b; animation:p 1s infinite; }
    @keyframes p { 0%,100%{opacity:1} 50%{opacity:.3} }

    .header-right { display:flex; align-items:center; gap:10px; }
    .badge-total { font-size:.8rem; color:#C5D5E8; font-weight:700; background:rgba(146,168,209,.15); border:1px solid rgba(146,168,209,.3); border-radius:50px; padding:5px 14px; }
    .badge-novas {
      font-size:.8rem; color:#f0dda0; font-weight:700;
      background:rgba(201,168,108,.2); border:1px solid rgba(201,168,108,.4);
      border-radius:50px; padding:5px 14px;
      display:none; animation:pulseIn .4s ease;
    }
    @keyframes pulseIn { from{opacity:0;transform:scale(.8)} to{opacity:1;transform:scale(1)} }

    /* Foto principal — slideshow cinematográfico */
    .slide-wrap {
      position:fixed; inset:0; z-index:1;
      display:flex; align-items:center; justify-content:center;
    }

    .slide-img {
      max-width:82vw; max-height:78vh;
      object-fit:contain;
      border-radius:12px;
      box-shadow:0 24px 80px rgba(0,0,0,.9), 0 0 0 1px rgba(201,168,108,.2);
      position:absolute;
      animation:none;
    }
    .slide-img.entrando   { animation: fadeZoomIn .8s ease forwards; }
    .slide-img.saindo     { animation: fadeZoomOut .8s ease forwards; }

    @keyframes fadeZoomIn {
      from { opacity:0; transform:scale(.96); }
      to   { opacity:1; transform:scale(1); }
    }
    @keyframes fadeZoomOut {
      from { opacity:1; transform:scale(1); }
      to   { opacity:0; transform:scale(1.04); }
    }

    /* Vídeo */
    .slide-video {
      max-width:82vw; max-height:78vh;
      border-radius:12px;
      box-shadow:0 24px 80px rgba(0,0,0,.9);
      position:absolute;
      animation:none;
    }
    .slide-video.entrando { animation: fadeZoomIn .8s ease forwards; }
    .slide-video.saindo   { animation: fadeZoomOut .8s ease forwards; }

    /* Info do convidado */
    .slide-info {
      position:fixed; bottom:90px; left:0; right:0; z-index:10;
      text-align:center;
    }
    .slide-nome {
      font-family:'Playfair Display',serif; font-style:italic;
      font-size:1.5rem; color:#f0dda0;
      text-shadow:0 2px 16px rgba(0,0,0,.9);
      margin-bottom:4px;
      display:inline-block;
    }
    .slide-data { font-size:.78rem; color:rgba(197,213,232,.6); font-weight:600; display:block; }

    /* Barra de progresso automático */
    .prog-auto {
      position:fixed; bottom:68px; left:50%; transform:translateX(-50%);
      z-index:10; width:200px;
      height:2px; background:rgba(255,255,255,.15); border-radius:2px; overflow:hidden;
    }
    .prog-auto-fill {
      height:100%; background:rgba(201,168,108,.7); border-radius:2px;
      width:0%;
    }

    /* Miniaturas */
    .thumbs {
      position:fixed; bottom:0; left:0; right:0; z-index:10;
      display:flex; gap:6px; padding:10px 20px 14px;
      background:linear-gradient(0deg,rgba(0,0,0,.85),transparent);
      overflow-x:auto; justify-content:center;
    }
    .thumbs::-webkit-scrollbar { display:none; }
    .thumb {
      width:52px; height:52px; border-radius:6px; overflow:hidden; flex-shrink:0;
      border:2px solid transparent; cursor:pointer; transition:all .2s;
      opacity:.5;
    }
    .thumb.ativo { border-color:#c9a84c; opacity:1; transform:scale(1.12); box-shadow:0 4px 12px rgba(0,0,0,.5); }
    .thumb img, .thumb video { width:100%; height:100%; object-fit:cover; }

    /* Setas */
    .seta {
      position:fixed; top:50%; z-index:10; transform:translateY(-50%);
      background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.1);
      color:rgba(255,255,255,.8); border-radius:50%;
      width:50px; height:50px; font-size:1.4rem;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      transition:all .2s; backdrop-filter:blur(6px);
    }
    .seta:hover { background:rgba(155,58,74,.6); color:white; border-color:rgba(155,58,74,.4); }
    .seta-esq { left:20px; }
    .seta-dir { right:20px; }

    /* Notificação nova foto */
    .notif {
      position:fixed; top:80px; right:24px; z-index:20;
      background:rgba(122,37,53,.92);
      border-radius:12px; padding:12px 16px;
      display:none; align-items:center; gap:12px;
      box-shadow:0 8px 32px rgba(0,0,0,.5);
      border:1px solid rgba(201,168,108,.3);
      animation:si .4s ease; max-width:280px;
    }
    @keyframes si { from{transform:translateX(20px);opacity:0} to{transform:translateX(0);opacity:1} }
    .notif img { width:52px; height:52px; border-radius:8px; object-fit:cover; border:1.5px solid rgba(201,168,108,.4); flex-shrink:0; }
    .notif-t { font-family:'Playfair Display',serif; font-style:italic; font-size:.88rem; color:#f0dda0; }
    .notif-s { font-size:.72rem; color:rgba(240,221,160,.65); margin-top:3px; }

    /* Vazio */
    .vazio { position:fixed; inset:0; z-index:5; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center; background:linear-gradient(160deg,#080410,#120820); }
    .vazio .ic { font-size:5rem; opacity:.25; }
    .vazio h2 { font-family:'Playfair Display',serif; font-style:italic; font-size:2rem; color:#f0dda0; opacity:.45; }
    .vazio p { font-size:.9rem; color:rgba(197,213,232,.35); font-weight:600; }
    .vazio-url { margin-top:12px; font-size:.82rem; color:rgba(201,168,108,.4); font-family:'Playfair Display',serif; font-style:italic; }


    /* QR Code overlay na tela vazia */
    .qr-overlay {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .qr-box {
      background: white;
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,.4);
      border: 2px solid rgba(201,168,108,.4);
    }
    .qr-canvas { display: block; }
    .qr-label {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: .9rem;
      color: rgba(240,221,160,.6);
      text-align: center;
    }
    .qr-url {
      font-size: .75rem;
      color: rgba(201,168,108,.5);
      letter-spacing: .06em;
      text-align: center;
    }

    /* Footer */
    .footer {
      position:fixed; bottom:0; left:0; right:0; z-index:9;
      background:linear-gradient(0deg,rgba(0,0,0,.85),transparent);
      padding:60px 28px 8px;
      display:flex; align-items:flex-end; justify-content:center;
    }
    .footer-url { font-size:.72rem; color:rgba(201,168,108,.35); letter-spacing:.1em; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
</head>
<body>

<div id="bg"></div>

<div class="header">
  <div class="header-left">
    <span class="logo">🎀</span>
    <div class="titulo">Alice 15 Anos</div>
    <div class="badge-live"><div class="dot"></div> AO VIVO</div>
  </div>
  <div class="header-right">
    <div class="badge-novas" id="badge-novas"></div>
    <div class="badge-total" id="contador">0 fotos</div>
  </div>
</div>

<div class="slide-wrap" id="slide-wrap" style="display:none;">
  <img class="slide-img" id="slide-img-a" src="" alt="">
  <img class="slide-img" id="slide-img-b" src="" alt="" style="opacity:0;">
  <video class="slide-video" id="slide-vid-a" src="" style="display:none;" autoplay muted loop playsinline></video>
  <video class="slide-video" id="slide-vid-b" src="" style="display:none;opacity:0;" autoplay muted loop playsinline></video>
</div>

<div class="slide-info" id="slide-info" style="display:none;">
  <span class="slide-nome" id="slide-nome"></span>
  <span class="slide-data" id="slide-data"></span>
</div>

<button class="seta seta-esq" id="seta-esq" onclick="anterior()" style="display:none;">‹</button>
<button class="seta seta-dir" id="seta-dir" onclick="proximo()" style="display:none;">›</button>

<div class="prog-auto" id="prog-auto" style="display:none;">
  <div class="prog-auto-fill" id="prog-fill"></div>
</div>

<div class="thumbs" id="thumbs"></div>

<div class="notif" id="notif">
  <img id="notif-img" src="" alt="">
  <div>
    <div class="notif-t">Nova foto chegou! 🎉</div>
    <div class="notif-s" id="notif-s"></div>
  </div>
</div>

<div class="vazio" id="vazio">
  <div class="ic">📸</div>
  <h2>Aguardando fotos…</h2>
  <p>Escaneie o QR code e envie suas fotos da festa!</p>
  <div class="qr-overlay">
    <div class="qr-box">
      <canvas class="qr-canvas" id="qr-canvas"></canvas>
    </div>
    <div class="qr-label">Aponte a câmera para enviar suas fotos</div>
    <div class="qr-url">alice15anos.vercel.app/fotos.html</div>
  </div>
</div>

<div class="footer">
  <div class="footer-url">alice15anos.vercel.app/fotos.html · Envie suas fotos!</div>
</div>

<script>
  const sb = window.supabase.createClient(
    'https://abojdhxobsyrzyiacaqf.supabase.co',
    'sb_publishable_RUJYFhofTbBt1CtW1ZtbtA_b_s83A4t',
    { auth: { persistSession: false } }
  );

  let fotos = [];
  let idx = 0;
  let ultimoId = 0;
  let totalInicial = -1;
  let novasSessao = 0;
  let autoTimer = null;
  let progTimer = null;
  let ativo = 'a'; // alterna entre img-a e img-b

  const INTERVALO = 6000; // 6 segundos por foto

  function fmt(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'long'}) + ' · ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }

  function isVideo(url) {
    return /\.(mp4|mov|webm|avi|mkv)/i.test(url);
  }

  function mostrarSlide(i, animado = true) {
    if (!fotos.length) return;
    idx = ((i % fotos.length) + fotos.length) % fotos.length;
    const foto = fotos[idx];
    const bg   = document.getElementById('bg');

    bg.style.backgroundImage = `url('${foto.url}')`;
    document.getElementById('slide-nome').textContent = '📸 ' + (foto.nome || 'Convidado');
    document.getElementById('slide-data').textContent = fmt(foto.criado_em);

    // Transição cinematográfica A/B
    const prox = ativo === 'a' ? 'b' : 'a';
    const elAtual_img = document.getElementById(`slide-img-${ativo}`);
    const elProx_img  = document.getElementById(`slide-img-${prox}`);
    const elAtual_vid = document.getElementById(`slide-vid-${ativo}`);
    const elProx_vid  = document.getElementById(`slide-vid-${prox}`);

    // Esconder todos os prox
    elProx_img.style.display = 'block';
    elProx_img.style.opacity = '0';
    elProx_vid.style.display = 'none';
    elProx_vid.style.opacity = '0';

    if (isVideo(foto.url)) {
      elProx_img.style.display = 'none';
      elProx_vid.style.display = 'block';
      elProx_vid.src = foto.url;
      elProx_vid.load();
    } else {
      elProx_img.src = foto.url;
      elProx_vid.style.display = 'none';
    }

    if (animado) {
      // Saída do atual
      elAtual_img.classList.remove('entrando'); elAtual_img.classList.add('saindo');
      elAtual_vid.classList.remove('entrando'); elAtual_vid.classList.add('saindo');
      // Entrada do próximo
      setTimeout(() => {
        if (isVideo(foto.url)) {
          elProx_vid.style.opacity = '1';
          elProx_vid.classList.remove('saindo'); elProx_vid.classList.add('entrando');
        } else {
          elProx_img.style.opacity = '1';
          elProx_img.classList.remove('saindo'); elProx_img.classList.add('entrando');
        }
        elAtual_img.style.opacity = '0'; elAtual_img.classList.remove('saindo');
        elAtual_vid.style.opacity = '0'; elAtual_vid.classList.remove('saindo');
      }, 400);
    } else {
      elAtual_img.style.opacity = '0';
      elAtual_vid.style.opacity = '0';
      if (isVideo(foto.url)) {
        elProx_vid.style.opacity = '1';
      } else {
        elProx_img.style.opacity = '1';
      }
    }

    ativo = prox;

    // Thumbs
    document.querySelectorAll('.thumb').forEach((t,ti) => t.classList.toggle('ativo', ti===idx));

    reiniciarAuto();
    reiniciarProg();
  }

  function proximo()  { mostrarSlide(idx + 1, true); }
  function anterior() { mostrarSlide(idx - 1, true); }

  function reiniciarAuto() {
    clearInterval(autoTimer);
    if (fotos.length > 1) autoTimer = setInterval(() => mostrarSlide(idx + 1, true), INTERVALO);
  }

  function reiniciarProg() {
    clearInterval(progTimer);
    const fill = document.getElementById('prog-fill');
    fill.style.transition = 'none'; fill.style.width = '0%';
    if (fotos.length > 1) {
      setTimeout(() => {
        fill.style.transition = `width ${INTERVALO}ms linear`;
        fill.style.width = '100%';
      }, 50);
    }
  }

  function atualizarUI() {
    const vazio = document.getElementById('vazio');
    const slideWrap = document.getElementById('slide-wrap');
    const info = document.getElementById('slide-info');
    const prog = document.getElementById('prog-auto');

    if (!fotos.length) {
      vazio.style.display = 'flex';
      slideWrap.style.display = 'none';
      info.style.display = 'none';
      prog.style.display = 'none';
      document.getElementById('seta-esq').style.display = 'none';
      document.getElementById('seta-dir').style.display = 'none';
      return;
    }

    vazio.style.display = 'none';
    slideWrap.style.display = 'flex';
    info.style.display = 'block';
    prog.style.display = fotos.length > 1 ? 'block' : 'none';
    document.getElementById('seta-esq').style.display = fotos.length > 1 ? 'flex' : 'none';
    document.getElementById('seta-dir').style.display = fotos.length > 1 ? 'flex' : 'none';

    // Thumbs
    const thumbs = document.getElementById('thumbs');
    thumbs.innerHTML = fotos.map((f,i) => `
      <div class="thumb ${i===idx?'ativo':''}" onclick="mostrarSlide(${i},true)">
        ${isVideo(f.url)
          ? `<video src="${f.url}" muted playsinline style="width:100%;height:100%;object-fit:cover;"></video>`
          : `<img src="${f.url}" alt="">`}
      </div>`).join('');

    document.getElementById('contador').textContent = `${fotos.length} foto${fotos.length!==1?'s':''}`;
  }

  function atualizarBadgeNovas() {
    const badge = document.getElementById('badge-novas');
    if (novasSessao > 0) {
      badge.textContent = `+${novasSessao} nova${novasSessao>1?'s':''} ✨`;
      badge.style.display = 'block';
    } else {
      badge.style.display = 'none';
    }
  }

  async function buscarFotos() {
    const { data } = await sb.from('fotos_festa').select('*').order('criado_em', { ascending: false }).limit(50);
    if (!data) return;

    // Primeira carga
    if (totalInicial === -1) {
      totalInicial = data.length;
      ultimoId = data.length ? Math.max(...data.map(f => f.id)) : 0;
      fotos = data;
      atualizarUI();
      if (fotos.length) mostrarSlide(0, false);
      return;
    }

    // Novas fotos
    const novas = data.filter(f => f.id > ultimoId);
    if (novas.length) {
      ultimoId = Math.max(...data.map(f => f.id));
      novasSessao += novas.length;
      fotos = data;
      atualizarBadgeNovas();
      atualizarUI();

      // Notificação para cada nova
      novas.forEach((foto, i) => {
        setTimeout(() => {
          const notif = document.getElementById('notif');
          document.getElementById('notif-img').src = isVideo(foto.url)
            ? 'https://via.placeholder.com/52x52/9b3a4a/white?text=🎥'
            : foto.url;
          document.getElementById('notif-s').textContent = (foto.nome || 'Um convidado') + ' enviou!';
          notif.style.display = 'flex';
          setTimeout(() => notif.style.display = 'none', 4000);
        }, i * 1000);
      });
    }
  }

  // Gerar QR code
  try {
    QRCode.toCanvas(document.getElementById('qr-canvas'),
      'https://alice15anos.vercel.app/fotos.html',
      { width: 180, margin: 1, color: { dark: '#7a2535', light: '#ffffff' } }
    );
  } catch(e) { console.warn('QR:', e); }

  buscarFotos();
  setInterval(buscarFotos, 3000);

  // Teclado
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ') proximo();
    if (e.key === 'ArrowLeft') anterior();
  });
</script>
</body>
</html>

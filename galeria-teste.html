
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Galeria ao Vivo · Alice 15 Anos</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400;1,700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Quicksand',sans-serif; min-height:100vh; background:#0a0608; color:white; overflow:hidden; }
    .header { position:fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:16px 28px; background:linear-gradient(180deg,rgba(10,6,8,.95),transparent); }
    .header-left { display:flex; align-items:center; gap:12px; }
    .header-titulo { font-family:'Playfair Display',serif; font-style:italic; font-size:1.3rem; color:#f0dda0; }
    .badge-live { display:flex; align-items:center; gap:6px; background:rgba(155,58,74,.85); border-radius:50px; padding:5px 12px; font-size:.75rem; font-weight:700; }
    .dot-live { width:8px; height:8px; border-radius:50%; background:#ff6b6b; animation:pulsar 1s infinite; }
    @keyframes pulsar { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.8)} }
    .contador-fotos { font-size:.82rem; color:#c9a84c; font-weight:700; }
    .galeria { position:fixed; inset:0; display:grid; grid-template-columns:repeat(4,1fr); grid-auto-rows:25vh; gap:3px; }
    .foto-item { position:relative; overflow:hidden; background:#1a0a0e; animation:aparecer .6s ease; }
    @keyframes aparecer { from{opacity:0;transform:scale(.95)} to{opacity:1;transform:scale(1)} }
    .foto-item img { width:100%; height:100%; object-fit:cover; }
    .foto-overlay { position:absolute; bottom:0; left:0; right:0; background:linear-gradient(transparent,rgba(0,0,0,.7)); padding:20px 10px 8px; opacity:0; transition:opacity .3s; }
    .foto-item:hover .foto-overlay { opacity:1; }
    .foto-nome { font-size:.75rem; color:#f0dda0; font-weight:700; }
    .notif { position:fixed; bottom:24px; right:24px; z-index:200; background:linear-gradient(135deg,#9b3a4a,#7a2535); border-radius:12px; padding:12px 16px; display:none; align-items:center; gap:12px; box-shadow:0 8px 32px rgba(0,0,0,.4); animation:slideIn .4s ease; }
    @keyframes slideIn { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }
    .notif img { width:52px; height:52px; border-radius:8px; object-fit:cover; }
    .notif-titulo { font-size:.78rem; font-weight:700; color:#f0dda0; }
    .notif-sub { font-size:.7rem; color:rgba(255,255,255,.6); }
    .vazio { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center; }
    .vazio .icone { font-size:4rem; opacity:.3; }
    .vazio h2 { font-family:'Playfair Display',serif; font-style:italic; font-size:1.5rem; color:#f0dda0; opacity:.5; }
    .vazio p { font-size:.85rem; color:rgba(255,255,255,.3); font-weight:600; }
    .footer { position:fixed; bottom:0; left:0; right:0; background:linear-gradient(0deg,rgba(10,6,8,.95),transparent); padding:20px 28px 16px; display:flex; align-items:center; justify-content:center; }
    .footer-url { font-size:.78rem; color:rgba(201,168,108,.5); letter-spacing:.08em; }
  </style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <span style="font-size:1.5rem;">🎀</span>
    <div class="header-titulo">Alice 15 Anos</div>
    <div class="badge-live"><div class="dot-live"></div> AO VIVO</div>
  </div>
  <div class="contador-fotos" id="contador">0 fotos</div>
</div>
<div class="galeria" id="galeria"></div>
<div class="vazio" id="vazio">
  <div class="icone">📸</div>
  <h2>Aguardando fotos…</h2>
  <p>Escaneie o QR code e envie suas fotos da festa!</p>
</div>
<div class="notif" id="notif">
  <img id="notif-img" src="" alt="">
  <div>
    <div class="notif-titulo">Nova foto chegou! 🎉</div>
    <div class="notif-sub" id="notif-nome"></div>
  </div>
</div>
<div class="footer">
  <div class="footer-url">alice15anos.vercel.app/fotos-teste.html · Envie suas fotos!</div>
</div>
<script>
  const sb = window.supabase.createClient(
    'https://abojdhxobsyrzyiacaqf.supabase.co',
    'sb_publishable_RUJYFhofTbBt1CtW1ZtbtA_b_s83A4t',
    { auth: { persistSession: false } }
  );

  let ultimoId = 0;
  let todasFotos = [];

  async function buscarFotos() {
    const { data, error } = await sb
      .from('fotos_festa')
      .select('*')
      .order('criado_em', { ascending: false })
      .limit(16);
    if (error || !data) return;

    // Detectar novas
    const novas = data.filter(f => f.id > ultimoId);
    if (novas.length) {
      ultimoId = Math.max(...data.map(f => f.id));
      todasFotos = data;
      renderizarGaleria();
      novas.forEach(f => mostrarNotificacao(f));
    } else if (!todasFotos.length && data.length) {
      ultimoId = Math.max(...data.map(f => f.id));
      todasFotos = data;
      renderizarGaleria();
    }

    document.getElementById('contador').textContent = `${data.length} foto${data.length!==1?'s':''}`;
  }

  function renderizarGaleria() {
    const galeria = document.getElementById('galeria');
    const vazio = document.getElementById('vazio');
    if (!todasFotos.length) { vazio.style.display='flex'; galeria.innerHTML=''; return; }
    vazio.style.display = 'none';
    galeria.innerHTML = todasFotos.map(f => `
      <div class="foto-item">
        <img src="${f.url}" alt="Foto da festa" loading="lazy">
        <div class="foto-overlay"><div class="foto-nome">📸 ${f.nome||'Convidado'}</div></div>
      </div>`).join('');
  }

  function mostrarNotificacao(foto) {
    const notif = document.getElementById('notif');
    document.getElementById('notif-img').src = foto.url;
    document.getElementById('notif-nome').textContent = foto.nome || 'Um convidado enviou uma foto!';
    notif.style.display = 'flex';
    setTimeout(() => { notif.style.display = 'none'; }, 4000);
  }

  buscarFotos();
  setInterval(buscarFotos, 3000);
</script>
</body>
</html>
